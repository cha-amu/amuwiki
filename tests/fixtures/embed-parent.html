<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>임베드 검수</title>
  </head>
  <body>
    <output id="message">대기</output>
    <iframe
      title="검수용 연결 지도"
      sandbox="allow-scripts allow-same-origin allow-top-navigation-by-user-activation"
      referrerpolicy="no-referrer"
      style="width: 90vw; height: 400px"
    ></iframe>
    <script>
      const frame = document.querySelector('iframe');
      const requested = new URLSearchParams(location.search).get('embed');
      if (requested) {
        const url = new URL(requested);
        if (url.origin === 'http://127.0.0.1:4186') {
          frame.src = url.href;
          window.addEventListener('message', (event) => {
            if (
              event.source === frame.contentWindow &&
              event.origin === url.origin &&
              event.data?.type === 'amuwiki:escape'
            ) {
              document.querySelector('#message').textContent = event.data.type;
            }
          });
        }
      }
    </script>
  </body>
</html>
